<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magna Fuel S.R.L.</title>
<style>
  :root {
    --bg: #ded9c4;
    --blue: #1c3f8f;
    --orange: #f07d1a;
    --text: #1a1a1a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .card {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 40px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .logo-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .logo-wrap img {
    max-width: 480px;
    width: 100%;
    height: auto;
  }

  .srl {
    font-weight: 800;
    letter-spacing: 2px;
    font-size: 1.1rem;
    color: var(--text);
    margin-top: -6px;
  }

  .tagline {
    margin-top: 30px;
    font-weight: 800;
    font-size: 1.05rem;
    line-height: 1.4;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--blue) 0%, var(--orange) 50%, var(--blue) 100%);
    background-size: 200% auto;
    background-position: 0% center;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: -200% center; }
  }

  footer {
    margin-top: 60px;
    margin-bottom: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  footer .sep {
    color: var(--text);
    opacity: 0.6;
  }

  footer a {
    color: var(--text);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 20px; }
    .tagline { font-size: 0.95rem; }
    footer { font-size: 0.75rem; gap: 8px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/image/magnafuel-logo-01.png" alt="Magna Fuel">
    </div>
    <div class="srl">S.R.L.</div>

    <p class="tagline">
      DISTRIBUIDORA<br>
      DE GASOLINA<br>
      Y DIESEL
    </p>
  </div>

  <footer>
    <span>La Paz - Bolivia</span>
    <span class="sep">|</span>
    <a href="mailto:contacto.magnafuel@gmail.com">contacto.magnafuel@gmail.com</a>
    <span class="sep">|</span>
    <span>+591 70619697</span>
  </footer>
</body>
</html>
